[project]
name = "eje-cafetero-api"
version = "0.1.0"
description = "ETL pipeline and API modeling coffees from Colombia's Eje Cafetero and the causal chain behind their flavor."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "alembic>=1.19,<1.20",
    "psycopg[binary]>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eje_cafetero_api"]
