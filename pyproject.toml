[project]
name = "eje-cafetero-api"
version = "0.1.0"
description = "ETL pipeline and API modeling coffees from Colombia's Eje Cafetero and the causal chain behind their flavor."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "alembic>=1.19,<1.20",
    "psycopg[binary]>=3,<4",
    "pyyaml>=6.0,<7",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# B008 flags `Depends(...)` as a default-argument function call, but that's
# the standard, idiomatic FastAPI pattern (see src/eje_cafetero_api/app.py)
# rather than a real issue, so it's disabled project-wide.
ignore = ["B008"]

[tool.dagster]
module_name = "eje_cafetero_api.definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eje_cafetero_api"]
